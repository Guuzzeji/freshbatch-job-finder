services:
  redis:
    image: redis:alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - dev-shared

  db:
    image: postgres:17-alpine
    container_name: db
    restart: always
    volumes:
      - dev-main-db:/var/lib/postgresql/data
      - ./db-queries/create_all.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      POSTGRES_PASSWORD: mySecretPassword
      POSTGRES_USER: myUser
    ports:
      - "5432:5432"
    networks:
      - dev-shared

volumes:
  dev-main-db:

networks:
  dev-shared:
    name: web-hook-job-tracker-dev-shared
