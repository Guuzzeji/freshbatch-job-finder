[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-checker"
version = "0.1.0"
description = "Web hook job tracker repository checker"
requires-python = ">=3.9"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[project.optional-dependencies]
local = ["shared @ file://localhost/${PROJECT_ROOT}/../shared"]
