services:
  redis:
    image: redis:alpine
    container_name: redis
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - app-network

  db:
    image: postgres:17-alpine
    container_name: db
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db-queries/create_all.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    networks:
      - app-network

  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: app
    restart: always
    environment:
      DATABASE_WEBHOOK_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/webhook_db
      DATABASE_AUTH_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/auth_db
      REDIS_URL: redis://redis:6379
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      - db
      - redis
    networks:
      - app-network

  repo-checker:
    build:
      context: .
      dockerfile: repo-checker/Dockerfile
    container_name: repo-checker
    restart: always
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - redis
    networks:
      - app-network

  webhook-publisher:
    build:
      context: .
      dockerfile: webhook-publisher/Dockerfile
    container_name: webhook-publisher
    restart: always
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      THREAD_COUNT: 5
    depends_on:
      - redis
      - db
    networks:
      - app-network

volumes:
  postgres_data:
  redis_data:

networks:
  app-network:
    driver: bridge
