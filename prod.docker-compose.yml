services:
  redis:
    image: redis:alpine
    container_name: redis
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - app-network

  db:
    image: postgres:17-alpine
    container_name: db
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - app-network
    # 1. Add the healthcheck so Docker knows when Postgres is actually ready
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: frontend.dockerfile
    container_name: app
    restart: always
    environment:
      DATABASE_WEBHOOK_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/webhook_db
      DATABASE_AUTH_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/auth_db
      REDIS_URL: redis://redis:6379
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      NODE_ENV: production
    ports:
      - "3131:3000"
    depends_on:
      - db
      - redis
    networks:
      - app-network

  repo-checker:
    build:
      context: .
      dockerfile: repo-checker.dockerfile
    container_name: repo-checker
    restart: always
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - redis
    networks:
      - app-network

  webhook-publisher:
    build:
      context: .
      dockerfile: web-pub.dockerfile
    container_name: webhook-publisher
    restart: always
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      THREAD_COUNT: 5
      POSTGRES_DSN_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/webhook_db
    depends_on:
      - redis
      - db
    networks:
      - app-network

volumes:
  postgres_data:
  redis_data:

networks:
  app-network:
    driver: bridge
